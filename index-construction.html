<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Segera Hadir</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        text-align: center;
        overflow: hidden;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      }

      /* Background image overlay */
      .bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background: url('https://images.unsplash.com/photo-1581090700227-1e8c6f6d2d9b?auto=format&fit=crop&w=1600&q=80')
          no-repeat center center/cover;
        opacity: 0.25;
        z-index: 0;
      }

      .container {
        z-index: 2;
        max-width: 800px;
        padding: 20px;
      }

      h1 {
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 10px;
      }

      p {
        font-size: 18px;
        opacity: 0.9;
        margin-bottom: 30px;
      }

      /* Countdown */
      .countdown {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
      }

      .time-box {
        background: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        width: 80px;
      }

      .time-box h2 {
        font-size: 24px;
      }

      .time-box span {
        font-size: 12px;
        opacity: 0.7;
      }

      /* Button */
      .btn {
        display: inline-block;
        padding: 12px 25px;
        background: #25d366;
        color: #fff;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn:hover {
        background: #1ebe5d;
        transform: scale(1.05);
      }

      /* Footer */
      .footer {
        position: absolute;
        bottom: 20px;
        width: 100%;
        font-size: 14px;
        opacity: 0.7;
      }

      .logo {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: auto;
      }

      /* Responsive */
      @media (max-width: 600px) {
        h1 {
          font-size: 32px;
        }
        .countdown {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>

  <body>
    <div class="bg"></div>

    <div class="container">
      <h1>🚧 Website Sedang Dibangun</h1>
      <p>
        Kami sedang mempersiapkan sesuatu yang luar biasa untuk Anda.<br />Stay
        tuned ya!
      </p>

      <!-- Countdown -->
      <div class="countdown">
        <div class="time-box">
          <h2 id="days">00</h2>
          <span>Hari</span>
        </div>
        <div class="time-box">
          <h2 id="hours">00</h2>
          <span>Jam</span>
        </div>
        <div class="time-box">
          <h2 id="minutes">00</h2>
          <span>Menit</span>
        </div>
        <div class="time-box">
          <h2 id="seconds">00</h2>
          <span>Detik</span>
        </div>
      </div>

      <!-- CTA -->
      <a href="https://wa.me/6281384072641" class="btn" target="_blank">
        Hubungi Kami via WhatsApp
      </a>
    </div>

    <div class="footer">
      <img
        src="https://carisolusi.biz.id/gambarbebas/20260322-103256_logo-diamant-blue.webp"
        class="logo"
        alt="logo-diamant"
      />© 2026 Diamant Digital - All Rights Reserved
    </div>

    <script>
      // Set tanggal launching (ubah sesuai kebutuhan)
      const launchDate = new Date('Apr 30, 2026 00:00:00').getTime();

      const timer = setInterval(function () {
        const now = new Date().getTime();
        const distance = launchDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById('days').innerHTML = days;
        document.getElementById('hours').innerHTML = hours;
        document.getElementById('minutes').innerHTML = minutes;
        document.getElementById('seconds').innerHTML = seconds;

        if (distance < 0) {
          clearInterval(timer);
          document.querySelector('.countdown').innerHTML =
            'Website Sudah Live 🎉';
        }
      }, 1000);
    </script>
  </body>
</html>
